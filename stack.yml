version: "3.8"

services:
  whoami:
    image: ghcr.io/fransallen/whoami:latest
    networks:
      - traefik-public
    deploy:
      replicas: 2
      labels:
        - traefik.enable=true

        # HTTPS router
        - traefik.http.routers.whoami-secure.rule=Host(`whoami.upset.dev`)
        - traefik.http.routers.whoami-secure.entrypoints=websecure
        - traefik.http.routers.whoami-secure.tls=true
        - traefik.http.routers.whoami-secure.service=whoami

        # Service
        - traefik.http.services.whoami.loadbalancer.server.port=8080
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

networks:
  traefik-public:
    external: true
